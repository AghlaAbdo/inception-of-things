# Official gitlab/gitlab chart, validated against 10.5.1 (GitLab 19.5.1).
# Local, single-node teaching lab. PostgreSQL, Redis and S3 are in dependencies.yaml.
global:
  edition: ce
  hosts:
    domain: iot.test
    https: false
    gitlab:
      name: gitlab.iot.test
  gatewayApi:
    enabled: false
    installEnvoy: false
    configureCertmanager: false
  ingress:
    apiVersion: networking.k8s.io/v1
    enabled: true
    provider: traefik
    class: traefik
    configureCertmanager: false
    tls:
      enabled: false
  psql:
    host: lab-postgresql.gitlab.svc.cluster.local
    port: 5432
    username: gitlab
    database: gitlabhq_production
    password:
      secret: gitlab-dependencies
      key: postgresql-password
  redis:
    host: lab-redis.gitlab.svc.cluster.local
    auth:
      enabled: true
      secret: gitlab-dependencies
      key: redis-password
  appConfig:
    object_store:
      enabled: true
      proxy_download: true
      connection:
        secret: gitlab-dependencies
        key: connection
  kas:
    enabled: false
  registry:
    enabled: false
  # Root password is generated by the official chart's shared-secrets job.
installCertmanager: false
nginx-ingress:
  enabled: false
traefik:
  install: false
prometheus:
  install: false
gitlab-runner:
  install: false
registry:
  enabled: false
gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 1
    workerProcesses: 2
    resources:
      requests:
        cpu: 300m
        memory: 2500Mi
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
    concurrency: 5
    resources:
      requests:
        cpu: 200m
        memory: 1500Mi
  gitlab-shell:
    # The defense workflow uses HTTP Git; no SSH entrypoint is configured.
    enabled: false
  gitaly:
    persistence:
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
  toolbox:
    enabled: false
  gitlab-exporter:
    enabled: false
