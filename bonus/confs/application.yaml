apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playground
  namespace: argocd
spec:
  project: default
  source:
    # In-cluster DNS works without /etc/hosts or access to the VM's loopback.
    repoURL: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/root/iot-playground.git
    targetRevision: main
    path: app
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
