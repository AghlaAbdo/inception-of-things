apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # Keep the defense responsive while retaining automatic polling-based sync.
  timeout.reconciliation: 30s
  timeout.reconciliation.jitter: 0s
