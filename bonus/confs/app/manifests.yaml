apiVersion: apps/v1
kind: Deployment
metadata:
  name: playground
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels: {app: playground}
  template:
    metadata:
      labels: {app: playground}
    spec:
      containers:
        - name: playground
          image: wil42/playground:v1
          ports:
            - {containerPort: 8888}
          readinessProbe:
            httpGet: {path: /, port: 8888}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: playground-service
  namespace: dev
spec:
  type: NodePort
  selector: {app: playground}
  ports:
    - {name: http, port: 8888, targetPort: 8888, nodePort: 30088}
